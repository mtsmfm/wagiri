<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wagiri</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<!-- GitHub Pages can't send COOP/COEP headers; this service worker retrofits
     them so the page becomes crossOriginIsolated (needed for wasm threads).
     No-op when the server already sends the headers. -->
<script src="/coi-serviceworker.min.js"></script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #222; }
  header { background: #2b3a55; color: #fff; padding: 10px 20px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 16px; margin: 0; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size: 14px; margin: 0 0 10px; color: #555; }
  button { background: #2b6cb0; color: #fff; border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
  button:hover { background: #2c5282; }
  button:disabled { background: #a0aec0; cursor: default; }
  button.secondary { background: #718096; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #dropzone { border: 2px dashed #cbd5e0; border-radius: 8px; padding: 30px; text-align: center; color: #718096; cursor: pointer; }
  #dropzone.drag { border-color: #2b6cb0; background: #ebf4ff; }
  #waveform { margin: 10px 0; }
  #status { font-size: 13px; color: #555; }
  #sep-status { font-size: 13px; }
  progress { width: 220px; height: 10px; }
  #time { font-variant-numeric: tabular-nums; font-size: 13px; color: #555; }
  kbd { background: #edf2f7; border-radius: 3px; padding: 1px 5px; font-size: 12px; }
  .hint { font-size: 12px; color: #888; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <img src="/logo.svg" alt="" width="26" height="26">
  <h1>Wagiri</h1><span id="time"></span>
  <select id="lang-select" style="margin-left:auto">
    <option value="ja">日本語</option>
    <option value="en">English</option>
  </select>
</header>
<main>
  <div class="card">
    <h2 data-i18n="step1.title">1. 音声ファイルを読み込む</h2>
    <div id="dropzone" data-i18n="dropzone.idle">ここにドロップ、またはクリックして選択(wav / mp3 / m4a など)</div>
    <input type="file" id="file-input" accept="audio/*,video/*" hidden>
  </div>

  <div class="card" id="sep-card" style="display:none">
    <h2 data-i18n="step2.title">2. BGM 分離(ブラウザ内で実行)</h2>
    <div class="row">
      <button id="btn-separate" data-i18n="btn.separate">BGM とボーカルを分離</button>
      <progress id="sep-progress" max="1" value="0" style="display:none"></progress>
      <span id="sep-status"></span>
    </div>
    <div class="row" id="stem-buttons" style="margin-top:8px"></div>
    <div class="hint" data-i18n="sep.hint">
      初回はモデルをダウンロードします(2回目以降はブラウザにキャッシュ)。
      音声はどこにも送信されず、すべてこのブラウザ内で処理されます。
    </div>
  </div>

  <div class="card" id="edit-card" style="display:none">
    <h2 data-i18n="step3.title">3. 波形編集 — 切り出し</h2>
    <div id="waveform"></div>
    <div class="row">
      <button id="btn-play" data-i18n="btn.play">再生 / 停止</button>
      <button id="btn-play-region" class="secondary" data-i18n="btn.playRegion">選択範囲を再生</button>
      <button id="btn-clear" class="secondary" data-i18n="btn.clear">選択解除</button>
      <button id="btn-export" data-i18n="btn.export">選択範囲を WAV で保存</button>
      <span id="status"></span>
    </div>
    <div class="hint" data-i18n-html="edit.hint">波形をドラッグで範囲選択。<kbd>ホイール</kbd> でズーム。範囲の端をドラッグで微調整。</div>
  </div>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
